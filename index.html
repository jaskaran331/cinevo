 an outside ad network and are always labelled. They open in a new tab when you tap them, and an ad blocker will hide them."},{question:"What is Live TV?",answer:"Open Live TV from the top bar or the menu. It has over a thousand channels in two lists: Indian TV, and 24/7 World channels. Pick a genre (Sports, Movies, Entertainment, Kids, News, Discovery & Science, Music or Devotional), then a language. Under Sports you can narrow to Cricket, Football, Badminton and more. Most Indian channels are restricted to India by their source, so from other countries a channel may stay black. If one won't load, try another."},{question:"How do downloads work?",answer:"On the watch page, open Download options. Files are listed by quality, best first, with their size and audio, and there's a Hindi-audio filter when any file has Hindi. A share page opens a folder of files; a direct link starts the download. The files are hosted by outside services, so availability varies by title."},{question:"How do I browse by genre?",answer:"Open Movies, Series, Anime or Drama and use the genre row under the tabs. Tap the Genres button to open every option in one searchable panel: classic genres, mash-ups like Romantic comedy, and themes like Heist, Zombies, Isekai, Time travel, Joseon era or Chaebol. There are 45 to 86 to pick from in each section, and the same filter works inside each streaming platform."},{question:"How do I watch something?",answer:"Tap any 3D book and it lifts off the page. Drag it to spin it 360°, and read its info and cast. Press Watch now and the book opens, then zooms into the player. Press Trailer and the book opens and plays the trailer across its pages. Or press Add to my list to save it for later."},{question:"Which server should I choose?",answer:"Start with Server 1. It's the fastest and most reliable, and the English servers together cover most movies. If one doesn't load, try another. They don't all carry every title."},{question:"How do I watch in Hindi?",answer:"Press Play and Cinevo opens a watch page that asks how you want to watch. For movies and series, pick Hindi to get the Hindi servers or English to get the English ones. You can switch any time from the player. Hindi audio depends on the title, so if one Hindi server has no track, try the other."},{question:"Can I watch anime subbed or dubbed?",answer:"Yes. For anime, the watch page asks 'Sub or dub?'. Subbed means Japanese audio with English subtitles; dubbed means English voice-over. Switch between them any time from the player. Not every anime has a dub."},{question:"Why does a title say it isn't available or won't play?",answer:"Playback depends on third-party providers, so a title can be missing on one server and present on another. Switch servers, change the season or episode, or try again a little later."},{question:"Why is the trailer muted sometimes?",answer:"Browsers only allow sound after you've interacted with the page. If a trailer starts muted, tap the speaker button at the bottom-right of the hero to turn sound on."},{question:"Where is my list saved?",answer:"My list is saved in your own browser. It stays on this device, and clearing your browser data will remove it. There's no account to create."},{question:"Are the platform logos an official partnership?",answer:"No. Netflix, Prime Video, Disney+ and the other names and logos belong to their owners. Cinevo isn't affiliated with or endorsed by them. The platform view simply uses TMDB data to show what's available on each service."},{question:"Will Cinevo become a real OTT platform?",answer:c.jsxs(c.Fragment,{children:["That's the dream: an affordable platform for everyone. It isn't ready yet, and the reasons are in the"," ",c.jsx("button",{className:"faq-inline-link",onClick:()=>zr("about"),children:"About section"}),". Follow us on Instagram, Telegram or Discord to be the first to know."]})}];function KN(){const n=pn(),[i,l]=x.useState(0);return c.jsx("section",{className:"info-section faq-sectio <style id="cinevo-master-theme">

/* ==========================================================================
   CINEVO CINEMATIC OBSIDIAN & VIBRANT LIME GREEN THEME
   ========================================================================== */
:root {
  color-scheme: dark !important;
  --ink: #08090d !important;
  --panel: #0e1017 !important;
  --panel-glass: rgba(14, 16, 23, 0.78) !important;
  --paper: #f8fafc !important;

  --faint: #64748b !important;
  --accent: #d6f578 !important;
  --accent-hover: #e5ff8f !important;
  --accent-deep: #a3e635 !important;
  --accent-2: #e08a58 !important;
  --accent-glow: rgba(214, 245, 120, 0.35) !important;
  --accent-faint: rgba(214, 245, 120, 0.08) !important;
  --line: rgba(255, 255, 255, 0.08) !important;
  --line-gold: rgba(214, 245, 120, 0.2) !important;
  background: #08090d !important;
  color: #f8fafc !important;
}

html, body {
  background: radial-gradient(ellipse 90% 50% at 20% -10%, rgba(214, 245, 120, 0.045) 0%, transparent 60%),
              radial-gradient(ellipse 70% 50% at 85% 5%, rgba(224, 138, 88, 0.035) 0%, transparent 55%),
              #08090d !important;
  color: #f8fafc !important;
  min-height: 100vh !important;
}

::selection {
  color: #08090d !important;
  background: #d6f578 !important;
}

/* Brand Wordmark & Monogram */
.brand-word {
  color: #f8fafc !important;
  letter-spacing: -0.06em !important;
  font-weight: 700 !important;
}
.brand-word > span {
  color: #d6f578 !important;
  text-shadow: 0 0 18px rgba(214, 245, 120, 0.55) !important;
}

/* Primary buttons with molten gold/amber gradient */
.button-primary {
  background: linear-gradient(135deg, #d6f578 0%, #a3e635 100%) !important;
  color: #08090d !important;
  font-weight: 700 !important;
  box-shadow: 0 4px 20px rgba(214, 245, 120, 0.38) !important;
  border-radius: 8px !important;
  border: none !important;
  transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1) !important;
}
.button-primary:hover {
  background: linear-gradient(135deg, #e5ff8f 0%, #a3e635 100%) !important;
  box-shadow: 0 6px 28px rgba(214, 245, 120, 0.55) !important;
  transform: translateY(-1px) !important;
}

.button-glass {
  background: rgba(255, 255, 255, 0.04) !important;
  backdrop-filter: blur(14px) !important;
  -webkit-backdrop-filter: blur(14px) !important;
  border: 1px solid rgba(255, 255, 255, 0.12) !important;
}
.button-glass:hover {
  color: #d6f578 !important;
  border-color: rgba(214, 245, 120, 0.55) !important;
  background: rgba(214, 245, 120, 0.09) !important;
  box-shadow: 0 0 20px rgba(214, 245, 120, 0.22) !important;

.hero-sound:hover, .hero-icon-btn:hover, .hero-icon-btn.is-active {
  color: #d6f578 !important;
  border-color: #d6f578 !important;

  box-shadow: 0 0 16px rgba(214, 245, 120, 0.25) !important;

  box-shadow: 0 0 12px rgba(214, 245, 120, 0.5) !important;

.hero-kicker, .section-eyebrow {
  color: #d6f578 !important;
  letter-spacing: 0.18em !important;
  font-weight: 700 !important;
}
.intro-screen {
  background: radial-gradient(at 50% 35%, #18151f 0%, #0d0e14 45%, #050608 90%) !important;
}
.intro-glow {
  background: radial-gradient(circle, rgba(214, 245, 120, 0.18), rgba(224, 138, 88, 0.12) 42%, transparent 68%) !important;
}
.intro-badge {
  color: #d6f578 !important;
  background: rgba(214, 245, 120, 0.08) !important;
  border: 1px solid rgba(214, 245, 120, 0.3) !important;

.intro-letter.is-accent {
  color: #d6f578 !important;
  text-shadow: 0 0 44px rgba(214, 245, 120, 0.65) !important;

.intro-enter {

  color: #08090d !important;

<script id="cinevo-host-idle-controller">

(function() {
  let idleTimer = null;
  function setPlayerIdle(isIdle) {
    if (isIdle) {
      document.body.classList.add('cinevo-user-idle');
      document.querySelectorAll('.live-player').forEach(el => el.classList.add('is-idle'));
      document.querySelectorAll('.watch-stage').forEach(el => el.classList.add('is-idle'));
    } else {
      document.body.classList.remove('cinevo-user-idle');
      document.querySelectorAll('.live-player').forEach(el => el.classList.remove('is-idle'));
      document.querySelectorAll('.watch-stage').forEach(el => el.classList.remove('is-idle'));
    }
    try {
      const iframes = document.querySelectorAll('iframe');
      iframes.forEach(ifr => {
        // Send postMessage for cross-origin or same-origin
        ifr.contentWindow?.postMessage({ type: isIdle ? 'cinevo:idle' : 'cinevo:active' }, '*');
        // Also direct class toggle if same-origin
        try {
          if (ifr.contentDocument) {
            if (isIdle) {
              ifr.contentDocument.documentElement.classList.add('cinevo-idle');
              if (ifr.contentDocument.body) ifr.contentDocument.body.classList.add('cinevo-idle');
            } else {
              ifr.contentDocument.documentElement.classList.remove('cinevo-idle');
              if (ifr.contentDocument.body) ifr.contentDocument.body.classList.remove('cinevo-idle');
            }
          }
        } catch(err) {}
      });
    } catch(e) {}
  }

  function markActive() {
    setPlayerIdle(false);
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      setPlayerIdle(true);
    }, 2500);
  }

  const events = ['mousemove', 'pointermove', 'touchstart', 'touchend', 'touchmove', 'keydown', 'click', 'wheel'];
  events.forEach(evt => {
    window.addEventListener(evt, markActive, { passive: true, capture: true });
    document.addEventListener(evt, markActive, { passive: true, capture: true });
  });

  window.addEventListener('message', e => {
    if (!e.data) return;
    if (e.data.type === 'cinevo:active' || e.data.type === 'cinevo:ping') {
      markActive();
    } else if (e.data.type === 'cinevo:idle') {
      setPlayerIdle(true);
    }
  });

  window.addEventListener('cinevo:user-active', markActive);
  markActive();
})();

</script>
